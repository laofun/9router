services:
  9router:
    build:
      context: .
      dockerfile: Dockerfile.npm
    image: 9router-public:latest
    container_name: 9router
    restart: unless-stopped
    ports:
      - "${PORT:-20128}:20128"
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      LAN_MODE: ${LAN_MODE:-true}
      HOSTNAME: 0.0.0.0
      PORT: 20128
    volumes:
      - 9router-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:20128/api/version >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  9router-data:
